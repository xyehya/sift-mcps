name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev

      - name: Ruff check (whole repo — single root config, no per-package overrides)
        run: uv run --locked --extra core --extra rag --extra dev ruff check .

  typecheck:
    name: Pyright typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev

      - name: Pyright sift-gateway policy layer
        run: uv run --locked --extra core --extra rag --extra dev pyright -p pyrightconfig.json

  test:
    name: Pytest full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev

      - name: Test (single root invocation)
        # addopts = "--import-mode=importlib" in [tool.pytest.ini_options]
        # (root pyproject.toml) resolves the monorepo's cross-package
        # duplicate-module collisions that used to require running pytest
        # once per package — see that section for the full rationale.
        run: |
          uv run --locked --extra core --extra rag --extra opencti --extra windows-triage \
            --extra dev pytest tests packages -m "not integration"

  coverage:
    name: Package coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev

      - name: Check per-package coverage floors
        run: |
          uv run --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev \
            python scripts/check_package_coverage.py

  docs:
    name: Docs freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked \
            --extra core \
            --extra rag \
            --extra opencti \
            --extra windows-triage \
            --extra dev

      - name: Check new-docs cross-references
        run: uv run --locked --extra core --extra rag --extra dev python scripts/check_newdocs_refs.py

  portal-dist:
    # G8: the gateway mounts a COMMITTED frontend build (no node on the install
    # VM). Guard against a stale dist by rebuilding from source and failing if
    # the committed static/v2 differs from a fresh build.
    name: Portal dist freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: packages/case-dashboard/frontend/package.json
          cache: npm
          cache-dependency-path: packages/case-dashboard/frontend/package-lock.json

      - name: Check committed portal dist is fresh
        run: bash scripts/check-portal-dist.sh

  shell-lint:
    # I-PS4 (#18): the installer is a thin install.sh entrypoint that sources
    # lib/*.sh. Gate it with `bash -n` (parse) on every shell unit + ShellCheck.
    # install.sh sources its modules via a DYNAMIC path ($SIFT_INSTALL_LIB_DIR/
    # ${_sift_lib}.sh) carrying `# shellcheck source=/dev/null`, so `shellcheck -x
    # install.sh` CANNOT descend into the modules — they must be linted directly.
    # We therefore ShellCheck install.sh + setup-addon.sh AND every lib/*.sh
    # explicitly so a defect inside a module is actually caught (.shellcheckrc
    # disables only SC2034 for the cross-module status globals).
    name: Shell lint (install.sh + lib)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: bash -n (parse) every shell unit
        run: |
          bash -n install.sh
          for f in lib/*.sh scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck the modular installer (entrypoint + every lib module)
        run: |
          shellcheck -x install.sh
          shellcheck -x scripts/setup-addon.sh
          # Lint each module directly — `-x` cannot follow install.sh's dynamic
          # `source` loop, so without this the lib/*.sh modules would only get
          # `bash -n` (parse), never a real ShellCheck pass.
          shellcheck lib/*.sh
