levels:
  HIGH:
    criteria: "Multiple corroborating evidence sources. Observation is unambiguous."
    min_audit_ids: 2
  MEDIUM:
    criteria: "At least one evidence source. Observation is clear but interpretation has alternatives."
    min_audit_ids: 1
  LOW:
    criteria: "Limited evidence. Reasonable inference but significant uncertainty. The floor tier — a hypothesis with no engaged evidence caps here."
    min_audit_ids: 0
