[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opencti-mcp"
dynamic = ["version"]
description = "MCP server: threat intelligence queries against OpenCTI instances"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "AppliedIncidentResponse.com" }
]
keywords = ["mcp", "opencti", "threat-intelligence", "security", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastmcp>=3",
    "mcp>=1.28.1",
    # Golden-path acceptance uses one exact OpenCTI/pycti tuple. Runtime
    # compatibility checks remain defense in depth for externally managed
    # deployments, but the installer must not resolve a moving client version.
    "pycti==7.260710.0",
    "sift-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
opencti-mcp = "opencti_mcp.__main__:main"

# Version single source of truth (#15/I-PS1): derived from the git release tag
# via hatch-vcs — no hand-edited literal. See root pyproject.toml for the full
# rationale; `--match v*` ignores the repo's non-PEP440 tags.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.6.2"
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/opencti_mcp"]

# pytest/ruff/coverage config is centralized at the repo root pyproject.toml.
# mypy was unused elsewhere in the repo (pyright is the type checker per
# docs/new-docs/LSP_AGENT_WORKFLOW.md) — dropped rather than centralized.
